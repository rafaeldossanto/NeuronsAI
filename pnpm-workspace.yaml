packages:
  - "apps/*"
  - "packages/*"
overrides:
  "esbuild@<0.25.0": "0.25.12"
  "glob@>=9.0.0 <=14.0.1": "14.0.2"
  "minimatch@>=7.0.0 <11.0.1": "11.0.1"
allowBuilds:
  cpu-features: false
  # electron: its install script downloads the Electron binary (cached by @electron/get).
  electron: true
  # electron-winstaller only matters for the Squirrel installer, which T22 does not use (NSIS).
  electron-winstaller: false
  esbuild: false
  # node-pty: on Windows the prebuilt binary in the package is enough, but its install script is what
  # compiles it on Linux (no prebuild there) and its postinstall makes spawn-helper executable on
  # macOS. With a prebuild present the script exits at once, so Windows needs no compiler.
  node-pty: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - electron@45.2.2
