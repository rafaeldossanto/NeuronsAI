name: Landing no GitHub Pages

# Preparado para decisão do Rafael: só executa manualmente, nunca em push/tag/PR.
on:
  workflow_dispatch:
    inputs:
      modeler_url:
        description: "URL HTTPS do modelador já hospedado (destino de Criar meu projeto)"
        type: string
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEURONS_MODELER_URL: ${{ inputs.modeler_url }}
      NEURONS_SITE_BASE: /${{ github.event.repository.name }}/
      NEURONS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Validar o destino do modelador
        run: |
          node --input-type=module -e 'const url = new URL(process.env.NEURONS_MODELER_URL); if (url.protocol !== "https:" || url.username || url.password) throw new Error("Use a URL HTTPS pública do modelador.");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter=./apps/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato preparado
        id: deployment
        uses: actions/deploy-pages@v5
