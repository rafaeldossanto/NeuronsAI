name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Nothing here runs Electron (the desktop job does), so skip downloading its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo lint typecheck test build --cache-dir=.turbo
      # Depois do build: a geração lê os pacotes compilados (graph-schema, agent-runtimes).
      - run: pnpm api:check

  # Testcontainers usa o Docker do runner ubuntu; nenhuma variável de ambiente é necessária.
  integration:
    name: integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@neurons/server^...
      - run: pnpm --filter @neurons/server test:integration

  # T21: the Electron app is laid out (`electron-builder --dir`, no installer) on each system, with
  # node-pty rebuilt for Electron. On Windows the packaged app is also started and runs a graph.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The Electron binary and the helpers electron-builder downloads, per system.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-desktop-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-desktop-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@neurons/desktop... --cache-dir=.turbo
      - run: pnpm --filter @neurons/desktop dist:dir
      - name: Packaged app runs a graph (fake Claude Code CLI)
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/smoke.mjs "${{ github.workspace }}\apps\desktop\release\win-unpacked\NeuronsAI.exe"

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
