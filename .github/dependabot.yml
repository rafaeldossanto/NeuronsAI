version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # O pnpm 12 recusa pacotes publicados há menos de 1 dia (minimumReleaseAge); o cooldown evita PRs que falhariam.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Os tipos acompanham o Node 24 do projeto; saltos de major do @types/node não se aplicam.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
